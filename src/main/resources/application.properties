spring.application.name=planifikausersapi

# ===============================
# Server Configuration
# ===============================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api/v1}

# ===============================
# DATABASE - Supabase PostgreSQL
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# ===============================
# HikariCP Pool Tuning (Supabase)
# ===============================
# Ajusta estos valores via variables de entorno para no sobrepasar el límite de conexiones de Supabase.
# Recomendación Free tier (≈15 conexiones totales): maximum-pool-size 5-7.
# Reserva siempre 2-3 conexiones para consola / administración / tareas externas.
spring.datasource.hikari.pool-name=PlanifikaHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1740000}
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION:0}
# Evita fallo de arranque si no puede abrir conexiones (no soluciona límite, solo tolera arranque)
spring.datasource.hikari.initialization-fail-timeout=-1
# Optimización driver PostgreSQL (cache de prepared statements en cliente; server-side deshabilitado por prepareThreshold=0)
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

spring.jpa.open-in-view=false


# ===============================
# Supabase API (para consumo externo)
# ===============================
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}
supabase.service.key=${SUPABASE_SERVICE_KEY}
supabase.jwt.secret=${SUPABASE_JWT_SECRET}

# ===============================
# General Configuration
# ===============================
spring.docker.compose.enabled=false
spring.config.import=optional:file:.env[.properties]

# ===============================
# Observabilidad - Prometheus / Actuator
# ===============================
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
management.server.base-path=/actuator