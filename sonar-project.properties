# SonarQube Configuration
sonar.projectKey=organizations-api
sonar.projectName=Organizations API
sonar.projectVersion=0.0.1-SNAPSHOT

# Encoding
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java specific settings
sonar.java.source=17
sonar.java.target=17
sonar.java.libraries=target/classes
sonar.java.test.libraries=target/test-classes

# Coverage and test reports (if you have them)
# sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# sonar.junit.reportPaths=target/surefire-reports

# Exclusions
sonar.exclusions=**/target/**,**/node_modules/**,**/*.class

# SonarQube server
sonar.host.url=http://localhost:9000
sonar.login=TU_TOKEN

# Additional properties for better analysis
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes